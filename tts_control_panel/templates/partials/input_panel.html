<section class="panel">
  <div class="panel-row-header">
    <label for="script-input" class="panel-label">Script</label>
    <span id="word-count" class="word-count mono">0 / {{ max_script_words }} words</span>
  </div>

  <div class="editor-shell">
    <div id="editor-mirror" class="editor-mirror mono"></div>
    <textarea id="script-input" class="editor-textarea mono" spellcheck="false">{{ initial_text }}</textarea>
  </div>

  <div class="emotion-tags-block">
    <div class="emotion-tags-label">Patch bay — click to insert</div>

    <div id="emotion-tags-common" class="emotion-tags">
      {% for tag in emotion_common_tags %}
      <button type="button" class="emotion-tag mono" data-tag="{{ tag }}">[{{ tag }}]</button>
      {% endfor %}
      <button type="button" id="emotion-tags-expand" class="emotion-tag emotion-tag-toggle mono">
        +{{ emotion_tag_more_count }} more
      </button>
    </div>

    <div id="emotion-tags-grouped" class="emotion-tag-groups is-hidden">
      {% for group_name, group_tags in emotion_tag_groups %}
      <div class="emotion-tag-group">
        <div class="emotion-tag-group-label">{{ group_name }}</div>
        <div class="emotion-tags">
          {% for tag in group_tags %}
          <button type="button" class="emotion-tag mono" data-tag="{{ tag }}">[{{ tag }}]</button>
          {% endfor %}
        </div>
      </div>
      {% endfor %}
      <button type="button" id="emotion-tags-collapse" class="emotion-tag emotion-tag-toggle mono emotion-tag-collapse">
        show fewer
      </button>
    </div>
  </div>
</section>
