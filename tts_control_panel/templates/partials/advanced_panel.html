<section class="panel panel-collapsible">
  <button type="button" id="advanced-toggle" class="collapsible-trigger">
    <span class="panel-title">Advanced config</span>
    <span id="advanced-chevron" class="chevron">▸</span>
  </button>

  <div id="advanced-body" class="collapsible-body is-hidden">
    <div class="advanced-note">Temperature, pacing, sampling seed, and pronunciation overrides land here.</div>
    <div class="advanced-disabled-fields">
      <div class="advanced-field-row"><span>Temperature</span><span class="mono">0.70</span></div>
      <input type="range" disabled class="range-input">
      <div class="advanced-field-row"><span>Random seed</span><span class="mono">auto</span></div>
      <input type="text" disabled class="text-input">
    </div>
  </div>
</section>
